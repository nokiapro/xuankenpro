<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download - COSPLAYER</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/gZ9wqD9G/LOGOCOSPLAYER.png" />
  <link rel="apple-touch-icon" href="https://i.ibb.co/gZ9wqD9G/LOGOCOSPLAYER.png" />
  <link rel="stylesheet" href="https://kit-pro.fontawesome.com/releases/v7.3.1/css/pro.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />

</head>
<body class="page-scroll">
  <div class="dl-page">
    <div class="dl-box" id="dlBox">
      <div class="logo"><i class="far fa-star"></i> COSPLAYER <i class="far fa-star"></i></div>
      <div id="dlContent">
        <p class="dl-sub"><i class="far fa-spinner fa-spin"></i> Đang kiểm tra link...</p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("t");
    const dlContent = document.getElementById("dlContent");
    let downloadUrl = null;
    let postIdForCount = null;
    let seconds = 10;
    let timer = null;

    function showError(msg) {
      dlContent.innerHTML = `
        <p class="dl-title"><i class="far fa-triangle-exclamation" style="color:#c62828"></i> Không thể tải</p>
        <p class="dl-error">${msg}</p>
        <p style="margin-top:20px"><a href="index.html" class="btn-back" style="display:inline-block;padding:10px 20px"><i class="far fa-arrow-left"></i> Trang chủ</a></p>
      `;
    }

    function startCountdown() {
      dlContent.innerHTML = `
        <p class="dl-title" id="dlTitle">Đang chuẩn bị file...</p>
        <p class="dl-sub">Vui lòng đợi <strong id="secText">10</strong> giây để lấy link tải an toàn.</p>
        <div class="dl-countdown" id="countdown">10</div>
        <a href="#" class="dl-btn disabled" id="dlBtn"><i class="far fa-lock"></i> Chờ đếm ngược...</a>
        <p class="dl-meta">Token: ${token.slice(0, 8)}… · Hết hạn 2 phút</p>
      `;

      const countdownEl = document.getElementById("countdown");
      const secText = document.getElementById("secText");
      const dlBtn = document.getElementById("dlBtn");

      timer = setInterval(() => {
        seconds--;
        countdownEl.textContent = seconds;
        secText.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(timer);
          countdownEl.classList.add("done");
          countdownEl.textContent = "✓";
          dlBtn.classList.remove("disabled");
          dlBtn.innerHTML = `<i class="far fa-download"></i> Tải file ngay`;
          dlBtn.href = downloadUrl;
          dlBtn.target = "_blank";
          dlBtn.rel = "noopener";
          document.getElementById("dlTitle").textContent = "Link đã sẵn sàng!";
          document.querySelector(".dl-sub").textContent = "Nhấn nút bên dưới để tải về.";

          dlBtn.addEventListener("click", async () => {
            try {
              await markTokenUsed(token);
              try {
                if (postIdForCount && typeof incrementPostDownloads === "function") {
                  await incrementPostDownloads(postIdForCount);
                }
              } catch (e) { console.warn("dl count", e); }
            } catch (e) {}
          });
        }
      }, 1000);
    }

    (async function () {
      if (!token) {
        showError("Thiếu token. Vui lòng vào trang chi tiết và bấm Tải lại.");
        return;
      }
      try {
        await initFirebase();
        if (typeof ensureAuthForDownload === "function") {
          await ensureAuthForDownload();
        } else if (firebaseAuth && !firebaseAuth.currentUser) {
          await firebaseAuth.signInAnonymously();
        }
        const data = await getDownloadToken(token);
        if (!data) {
          showError("Link không tồn tại hoặc đã bị xóa.");
          return;
        }
        if (data.expiresAt && Date.now() > data.expiresAt) {
          showError("Link đã hết hạn (2 phút). Vui lòng tạo lại từ trang chi tiết.");
          return;
        }
        if (data.used) {
          showError("Link đã được sử dụng. Vui lòng tạo link mới từ trang chi tiết.");
          return;
        }
        if (!data.url) {
          showError("Không có URL tải trong token.");
          return;
        }
        downloadUrl = data.url;
        postIdForCount = data.postId || null;
        if (data.title) document.title = "Tải: " + data.title + " - COSPLAYER";
        startCountdown();
      } catch (err) {
        console.error(err);
        showError("Lỗi Firebase: " + err.message);
      }
    })();
  </script>
</body>
</html>
